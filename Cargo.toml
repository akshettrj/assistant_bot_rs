[workspace]
members = [".", "migration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
sea-orm = { version = "2.0.3", default-features = false, features = [
  "macros",
  "with-chrono",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite",
] }
sea-orm-migration = { version = "2.0.3", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite",
] }
tokio = { version = "1.53.1", features = ["full"] }

[package]
name = "assistant_bot_rs"
description = "A personal Telegram assistant bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
migration = { path = "migration" }

anyhow = "1.0.104"
arc-swap = "1.9.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
futures = "0.3.34"
rustuya = "0.3.0"
sea-orm = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
teloxide = { version = "0.17.0", default-features = false, features = [
  "cache-me",
  "ctrlc_handler",
  "macros",
  "rustls",
  "throttle",
  "tracing",
] }
thiserror = "2.0.21"
tokio = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["env", "test", "toml"] }
tempfile = "3.27.0"
