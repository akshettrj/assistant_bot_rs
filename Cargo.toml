[workspace]
members = [".", "crates/*", "migration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
sea-orm = { version = "2.0.3", default-features = false, features = [
  "macros",
  "with-chrono",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite",
] }
sea-orm-migration = { version = "2.0.3", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite",
] }
tokio = { version = "1.53.1", features = ["full"] }

anyhow = "1.0.104"
arc-swap = "1.9.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
teloxide = { version = "0.17.0", default-features = false, features = [
  "cache-me",
  "ctrlc_handler",
  "macros",
  "rustls",
  "throttle",
  "tracing",
] }
thiserror = "2.0.21"
tracing = "0.1.44"

[package]
name = "assistant_bot_rs"
description = "A personal Telegram assistant bot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
botconf = { path = "crates/botconf", features = ["cli", "sea-orm"] }
botconf-telegram = { path = "crates/botconf-telegram" }
migration = { path = "migration" }

anyhow = { workspace = true }
arc-swap = { workspace = true }
base64 = "0.22.1"
chrono = { workspace = true }
chrono-tz = "0.10.4"
clap = { workspace = true }
figment = { workspace = true }
futures = { workspace = true }
humantime = "2.4.0"
iana-time-zone = "0.1.65"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.43.0", features = ["macros"] }
rustuya = "0.3.0"
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
teloxide = { workspace = true }
tempfile = "3.27.0"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
proptest = "1.11.0"
tokio = { workspace = true, features = ["test-util"] }
