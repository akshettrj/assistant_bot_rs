# Copy to `config.toml` and fill in.
#
# Every key can be overridden by an environment variable: `ASSISTANT_` + the
# key path in upper case, with `__` between levels, e.g.
# `ASSISTANT_TELEGRAM__BOT_TOKEN`.
#
# Keys marked "runtime" can also be changed from Telegram with /config (owner
# only). Those changes are stored in the database and win over this file;
# `/config unset <key>` goes back to the value here.

# Runtime. The IANA timezone used by schedules; defaults to the system's.
# timezone = "Asia/Kolkata"

[telegram]
# From @BotFather. Prefer the ASSISTANT_TELEGRAM__BOT_TOKEN env var.
bot_token = "123456:ABC-DEF..."
# For a self-hosted Bot API server; defaults to https://api.telegram.org.
# bot_api_url = "http://localhost:8081"
# Your own user id (send /id to the bot to find it).
owner_id = 123456789
# Runtime. Where handler errors are reported (the bot must be able to post there).
error_logs_chat_id = -1001234567890
# Runtime. Users who can use every module.
sudo_users_id = []

# Runtime. Users allowed to use a module, per module id.
[telegram.allowed_users]
# some_module = [111111111]

# Runtime. Chats whose members may use a module, per module id.
[telegram.allowed_chats]
# some_module = [-1009876543210]

[database]
# SQLite (`mode=rwc` creates the file) or `postgres://user:pass@host/db`.
url = "sqlite://assistant_bot.sqlite?mode=rwc"
run_migrations = true
# max_connections = 10
# min_connections = 1
connect_timeout_secs = 10
sqlx_logging = false

[logging]
# Runtime. tracing-subscriber EnvFilter syntax; RUST_LOG takes precedence at startup.
filter = "info,assistant_bot_rs=debug"
# full | compact | pretty
format = "full"

[modules]
# Runtime. Ids of the modules that are turned off.
disabled = []

# Settings of the `general` module (/start, /help, /id).
[modules.general]
# Runtime. Custom /start greeting; {name} is replaced with the user's first name.
# start_message = "Hi {name}!"

# Smart lights (/light): Tuya Wi-Fi bulbs such as Wipro's, controlled over the
# LAN. Get each light's id and local key with `nix run .#tuya-local-key`.
[modules.lights]
# Runtime. The light used when a command names none (optional with one light).
# default = "bedroom"

[modules.lights.devices.bedroom]
id = "your-device-id"
# Prefer ASSISTANT_MODULES__LIGHTS__DEVICES__BEDROOM__LOCAL_KEY.
local_key = "0123456789abcdef"
# Optional: discovered from the bulb's broadcasts if unset (needs UDP 6666,
# 6667 and 7000 open). A DHCP reservation for the bulb makes this reliable.
address = "192.168.1.50"
# Optional: the Tuya protocol version, detected if unset.
version = "3.5"
# Optional: the data point layout (auto | v1 | v2), detected if unset.
# layout = "auto"

# Runtime. Presets, shown as buttons on the panel and usable as /light <name>.
[modules.lights.presets]
reading = { brightness = 90, temperature = "neutral" }
night = { brightness = 5, temperature = "warm" }
relax = { brightness = 40, color = "orange" }
movie = { brightness = 30, scene = "rainbow" }

# Runtime. Custom scenes, next to the built-in ones (night, read, meeting,
# leisure, soft, rainbow, shine, beautiful); easiest to add with
# `/light scene add <name> [static|jump|gradient] <colours…> [speed 1–100]`.
[modules.lights.scenes.party]
# Colours (red, #ff8800) or whites (warm, neutral, cool, 4000k); up to 8.
steps = ["red", "green", "blue", "purple"]
# static (a single step), jump, or gradient (the default).
transition = "jump"
# 1–100 (default 50).
speed = 80

[modules.lights.scenes.candle]
steps = ["#ff8a00"]
transition = "static"
# 1–100 % (default 100).
brightness = 20

# Runtime. Schedules run /light actions at a time of day; easiest to manage
# with `/light schedule add|pause|resume|run|remove` and `/light schedules`.
[modules.lights.schedules.bedtime]
at = "22:30"
# daily (default), weekdays, weekends, mon,wed,fri or mon-fri.
days = "daily"
action = "preset night"

[modules.lights.schedules.wake]
at = "06:45"
days = "weekdays"
action = "brightness 100"
# Reach the action's brightness gradually, starting at `at`.
fade = "15m"
# Paused schedules stay configured but don't run.
enabled = false

# Shared trip expenses (/trip, /spent): who paid, who owes, and settling up.
# Allow it in a group with `telegram.allowed_chats.trips = [<group id>]`.
[modules.trips]
# Runtime. The currency of new trips when `/trip new` names none.
# default_currency = "INR"
# Runtime. Whether expenses logged in a private chat are announced in the
# trip's chat.
notify_home_chat = true
# Runtime. Whether foreign expenses use the day's European Central Bank rate
# (from frankfurter.dev) when the trip has no fixed rate for the currency.
# Fixed rates are set from the /trip panel.
auto_rates = true

# Runtime. Extra expense categories besides food, transport, stay, activities,
# shopping, health and other: an id (for `/spent 500 visa fee #visa`) and a
# label with an emoji.
[modules.trips.categories]
# visa = "🛂 Visa"

# The AI that reads messages (e.g. "dinner 2400, Ann and I split it" becomes a
# draft expense to check). It runs the Claude Code CLI (`claude`, which must be
# installed) with your Claude subscription, without tools, in an empty
# directory. Without a token, AI features are off.
[ai]
# A token from `claude setup-token`, valid a year. Prefer the environment:
# ASSISTANT_AI__OAUTH_TOKEN=sk-ant-oat01-...
# oauth_token = ""
# The `claude` program, if it isn't on the PATH.
# claude_path = "/home/you/.local/bin/claude"
# Runtime. sonnet, haiku (cheaper), opus, or a full model name.
model = "sonnet"
# Runtime. Who may use it besides the owner and the sudo users: it uses your
# subscription, which Anthropic's terms intend for your own use.
users = []
# Seconds before a request gives up, and at most this many at once.
timeout_secs = 60
max_concurrent = 2
